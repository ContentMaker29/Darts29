<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#080B11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дартс Лига">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дартс Лига Поморья — Особый случай</title>
<style>
  :root{
    --ink:#080B11; --panel:#111722; --line:#243044;
    --cream:#F5EFE3; --muted:#93A1B5; --blue:#56BEEB;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--ink); color:var(--cream); height:100dvh; overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; flex-direction:column;
  }

  #bar{
    flex:0 0 auto; display:none; align-items:center; gap:12px;
    padding:7px 12px; border-bottom:1px solid var(--line); background:#0B111A;
  }
  #bar.on{display:flex}
  #back{
    background:transparent; color:var(--cream); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer;
  }
  #back:active{transform:translateY(1px)}
  #barTitle{font-size:13px; font-weight:800; letter-spacing:.06em; color:var(--muted)}
  #barTitle b{color:var(--cream)}

  #stage{flex:1; position:relative; min-height:0}
  iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--ink)}
  iframe.on{display:block}

  /* ---------- меню ---------- */
  #menu{
    position:absolute; inset:0; overflow:auto; padding:22px 18px 28px;
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  #menu.off{display:none}
  .head{text-align:center; max-width:640px}
  .head h1{font-size:clamp(24px, 6vw, 40px); line-height:1.05; margin:0 0 6px; font-weight:900; letter-spacing:.02em}
  .head h1 span{color:var(--blue)}
  .head p{margin:0; color:var(--muted); font-size:13px; letter-spacing:.14em}

  .grid{width:100%; max-width:760px; display:grid; grid-template-columns:1fr; gap:12px}
  @media (min-width:760px){ .grid{grid-template-columns:1fr 1fr} #menu{justify-content:center} }

  .card{
    position:relative; text-align:left; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:18px 18px 16px; display:flex; flex-direction:column; gap:6px;
    color:var(--cream); font-family:inherit; overflow:hidden;
  }
  .card:active{transform:translateY(1px)}
  .card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--acc);
  }
  .card .tag{font-size:10px; letter-spacing:.18em; color:var(--acc); font-weight:800}
  .card .ttl{font-size:21px; font-weight:900; letter-spacing:.01em}
  .card .sub{color:var(--muted); font-size:13px; line-height:1.35}
  .card .go{
    margin-top:8px; align-self:flex-start; font-size:12px; font-weight:800; letter-spacing:.12em;
    color:var(--acc);
  }

  .foot{color:var(--muted); font-size:11px; letter-spacing:.16em; margin-top:6px}

  /* ---------- история ---------- */
  .hbtn{
    width:100%; max-width:760px; display:flex; align-items:center; justify-content:space-between;
    gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; color:var(--cream); font-family:inherit; font-size:15px; font-weight:800;
    cursor:pointer;
  }
  .hbtn .cnt{
    min-width:26px; height:26px; padding:0 8px; border-radius:13px; background:var(--blue);
    color:#04202C; font-size:13px; font-weight:900; display:grid; place-items:center;
  }
  #history{position:absolute; inset:0; display:none; flex-direction:column; background:var(--ink); z-index:5}
  #history.on{display:flex}
  #history .hhead{
    flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line);
  }
  #history .hhead .ttl{font-size:15px; font-weight:900; letter-spacing:.1em}
  #history .hhead .sp{flex:1}
  #history .hlist{flex:1 1 auto; overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:8px}
  #history .row{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 13px;
    display:flex; flex-direction:column; gap:3px;
  }
  #history .row .g{font-size:11px; letter-spacing:.12em; color:var(--muted); display:flex; justify-content:space-between; gap:8px}
  #history .row .t{font-size:15px; font-weight:800}
  #history .empty{color:var(--muted); font-size:13px; text-align:center; margin-top:24px; line-height:1.5}
  #history .hfoot{flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 14px 14px}
  #history .hfoot button{
    background:var(--panel); color:var(--cream); border:1px solid var(--line); border-radius:12px;
    padding:13px 8px; font-size:14px; font-weight:800; font-family:inherit; cursor:pointer;
  }
  #history .hfoot .primary{background:var(--blue); color:#04202C; border-color:var(--blue)}
</style>
</head>
<body>

<div id="bar">
  <button id="back">← Меню</button>
  <span id="barTitle"></span>
</div>

<main id="stage">
  <section id="menu">
    <div class="head">
      <h1>ДАРТС ЛИГА<br><span>ПОМОРЬЯ</span></h1>
      <p>ОСОБЫЙ СЛУЧАЙ · ВЫБЕРИТЕ ИГРУ</p>
    </div>

    <div class="grid" id="grid"></div>

    <button class="hbtn" id="historyBtn">
      <span>История матчей</span>
      <span class="cnt" id="historyCount">0</span>
    </button>

    <div class="foot">АРХАНГЕЛЬСК · VK.RU/DARTS29</div>
  </section>

  <section id="history">
    <div class="hhead">
      <button id="histBack" class="hbtn" style="width:auto;padding:8px 12px;font-size:13px">← Меню</button>
      <span class="ttl">ИСТОРИЯ</span>
      <span class="sp"></span>
    </div>
    <div class="hlist" id="histList"></div>
    <div class="hfoot">
      <button id="histShare" class="primary">Поделиться</button>
      <button id="histClear">Очистить</button>
    </div>
  </section>

  <iframe id="frame" title="Игра"></iframe>
</main>

const $ = s => document.querySelector(s);
const grid = $('#grid');
const frame = $('#frame');
let current = null;

function decode(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

GAMES.forEach(g => {
  const b = document.createElement('button');
  b.className = 'card';
  b.style.setProperty('--acc', g.color);
  b.innerHTML = `<span class="tag">${g.tag}</span>
    <span class="ttl">${g.title}</span>
    <span class="sub">${g.sub}</span>
    <span class="go">ОТКРЫТЬ →</span>`;
  b.addEventListener('click', () => openGame(g));
  grid.appendChild(b);
});

function openGame(g){
  $('#menu').classList.add('off');
  $('#bar').classList.add('on');
  $('#barTitle').innerHTML = `<b>${g.title}</b>`;
  if (current !== g.id){
    frame.srcdoc = decode(g.b64);
    current = g.id;
  }
  frame.classList.add('on');
}

function backToMenu(){
  frame.classList.remove('on');
  $('#bar').classList.remove('on');
  $('#menu').classList.remove('off');
}

$('#back').addEventListener('click', backToMenu);

/* ============================ ИСТОРИЯ МАТЧЕЙ ============================ */
const STORE = 'darts-liga-history-v1';
const MAX_ROWS = 50;

function loadHistory(){
  try { return JSON.parse(localStorage.getItem(STORE) || '[]'); } catch(e){ return []; }
}
function saveHistory(list){
  try { localStorage.setItem(STORE, JSON.stringify(list.slice(-MAX_ROWS))); } catch(e){}
}
function fmtDate(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function refreshCount(){
  $('#historyCount').textContent = loadHistory().length;
}
function renderHistory(){
  const list = loadHistory().slice().reverse();
  const box = $('#histList');
  if (!list.length){
    box.innerHTML = '<div class="empty">Пока пусто.<br>Сыграйте матч — результат появится здесь.</div>';
  } else {
    box.innerHTML = list.map(r => `<div class="row">
        <div class="g"><span>${r.game}</span><span>${fmtDate(r.ts)}</span></div>
        <div class="t">${r.text}</div>
      </div>`).join('');
  }
  refreshCount();
}
function openHistory(){
  $('#menu').classList.add('off');
  $('#history').classList.add('on');
  renderHistory();
}
function closeHistory(){
  $('#history').classList.remove('on');
  $('#menu').classList.remove('off');
}

$('#historyBtn').addEventListener('click', openHistory);
$('#histBack').addEventListener('click', closeHistory);

$('#histShare').addEventListener('click', async () => {
  const list = loadHistory().slice(-10).reverse();
  if (!list.length) return;
  const text = 'Дартс Лига Поморья — результаты\n' +
    list.map(r => fmtDate(r.ts) + ' · ' + r.game + ': ' + r.text).join('\n');
  try {
    if (navigator.share) await navigator.share({title: 'Дартс Лига', text: text});
    else { await navigator.clipboard.writeText(text); alert('Скопировано — вставьте в VK или чат'); }
  } catch(e){}
});

$('#histClear').addEventListener('click', () => {
  if (!confirm('Удалить всю историю на этом устройстве?')) return;
  saveHistory([]);
  renderHistory();
});

// игры присылают результат сюда
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.type !== 'darts-result' || !d.game || !d.text) return;
  const list = loadHistory();
  const last = list[list.length - 1];
  if (last && last.game === d.game && last.text === d.text && Math.abs(last.ts - d.ts) < 3000) return;
  list.push({game: d.game, text: d.text, ts: d.ts || Date.now()});
  saveHistory(list);
  refreshCount();
});

refreshCount();
</script>

<script>
  // PWA: офлайн-кеш и установка на домашний экран
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
