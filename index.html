<meta name="mobile-web-app-capable" content="yes">

<title>Дартс Лига Поморья — Особый случай</title>
<style>
  :root{
    --ink:#080B11; --panel:#111722; --line:#243044;
    --cream:#F5EFE3; --muted:#93A1B5; --blue:#56BEEB;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--ink); color:var(--cream); height:100dvh; overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; flex-direction:column;
  }

  #bar{
    flex:0 0 auto; display:none; align-items:center; gap:12px;
    padding:7px 12px; border-bottom:1px solid var(--line); background:#0B111A;
  }
  #bar.on{display:flex}
  #back{
    background:transparent; color:var(--cream); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer;
  }
  #back:active{transform:translateY(1px)}
  #barTitle{font-size:13px; font-weight:800; letter-spacing:.06em; color:var(--muted)}
  #barTitle b{color:var(--cream)}

  #stage{flex:1; position:relative; min-height:0}
  iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--ink)}
  iframe.on{display:block}

  /* ---------- меню ---------- */
  #menu{
    position:absolute; inset:0; overflow:auto; padding:22px 18px 28px;
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  #menu.off{display:none}
  .head{text-align:center; max-width:640px}
  .head h1{font-size:clamp(24px, 6vw, 40px); line-height:1.05; margin:0 0 6px; font-weight:900; letter-spacing:.02em}
  .head h1 span{color:var(--blue)}
  .head p{margin:0; color:var(--muted); font-size:13px; letter-spacing:.14em}

  .grid{width:100%; max-width:760px; display:grid; grid-template-columns:1fr; gap:12px}
  @media (min-width:760px){ .grid{grid-template-columns:1fr 1fr} #menu{justify-content:center} }

  .card{
    position:relative; text-align:left; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:18px 18px 16px; display:flex; flex-direction:column; gap:6px;
    color:var(--cream); font-family:inherit; overflow:hidden;
  }
  .card:active{transform:translateY(1px)}
  .card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--acc);
  }
  .card .tag{font-size:10px; letter-spacing:.18em; color:var(--acc); font-weight:800}
  .card .ttl{font-size:21px; font-weight:900; letter-spacing:.01em}
  .card .sub{color:var(--muted); font-size:13px; line-height:1.35}
  .card .go{
    margin-top:8px; align-self:flex-start; font-size:12px; font-weight:800; letter-spacing:.12em;
    color:var(--acc);
  }

  .foot{color:var(--muted); font-size:11px; letter-spacing:.16em; margin-top:6px}
</style>
</head>
<body>

<div id="bar">
  <button id="back">← Меню</button>

</div>

  </section>

</main>

const $ = s => document.querySelector(s);
const grid = $('#grid');
const frame = $('#frame');
let current = null;

function decode(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

GAMES.forEach(g => {
  const b = document.createElement('button');
  b.className = 'card';
  b.style.setProperty('--acc', g.color);
  b.innerHTML = `<span class="tag">${g.tag}</span>
    <span class="ttl">${g.title}</span>
    <span class="sub">${g.sub}</span>
    <span class="go">ОТКРЫТЬ →</span>`;
  b.addEventListener('click', () => openGame(g));
  grid.appendChild(b);
});

function openGame(g){
  $('#menu').classList.add('off');
  $('#bar').classList.add('on');
  $('#barTitle').innerHTML = `<b>${g.title}</b>`;
  if (current !== g.id){
    frame.srcdoc = decode(g.b64);
    current = g.id;
  }
  frame.classList.add('on');
}

function backToMenu(){
  frame.classList.remove('on');
  $('#bar').classList.remove('on');
  $('#menu').classList.remove('off');
}

$('#back').addEventListener('click', backToMenu);
</script>

<script>
  // PWA: офлайн-кеш и установка на домашний экран
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
